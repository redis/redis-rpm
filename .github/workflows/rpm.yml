name: Build

# This workflow runs on regular PR/push to branches
# and is workflow_call'ed by nightly-unstable-package.yaml
# schedule to build unstable release
# The main purpose of the workflow to determine whether we need
# to use "unstable" release_tag
# The actual job dispatch is done by build-n-test-all-distros.yml

on:
  pull_request:
    branches:
    - master
    - release/*
    - unstable
  push:
    branches:
    - master
    - release/*
    - unstable
  workflow_dispatch:
  workflow_call:
    secrets:
      SECURITY_API_TOKEN:
        description: Tracebit API token for CI canary credentials
        required: false

run-name: >-
        ${{ (github.ref_name == 'unstable'
        || github.base_ref == 'unstable'
        || github.event_name == 'workflow_dispatch'
        || github.event_name == 'workflow_call'
        || github.event_name == 'schedule')
        && 'Build Unstable'
        || format('Build on {0} to {1}', github.event_name, github.ref_name)
        }}

# Fork pull requests and Dependabot runs do not receive the Tracebit secret.
env:
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  populate-env-vars:
    runs-on: ["ubuntu-latest"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{ (github.event_name != 'pull_request'
            && (github.ref_name == 'unstable'
            || github.event_name == 'workflow_dispatch'
            || github.event_name == 'workflow_call'
            || github.event_name == 'schedule'))
            && 'unstable'
            || ''
            }}

      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@904ee3a84578e3b19bcd0e8c9354051fe148d51e # v1.3.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true

      - name: Parse vars
        id: parse
        uses: ./.github/actions/parse-env-file

    outputs:
      BUILD_OS: ${{ steps.parse.outputs.BUILD_OS }}
      TEST_OS: ${{ steps.parse.outputs.TEST_OS }}

  build-n-test:
    uses: ./.github/workflows/build-n-test-all-distros.yml
    secrets:
      SECURITY_API_TOKEN: ${{ secrets.SECURITY_API_TOKEN }}
    needs: populate-env-vars
    with:
      BUILD_OS: ${{ needs.populate-env-vars.outputs.BUILD_OS }}
      TEST_OS: ${{ needs.populate-env-vars.outputs.TEST_OS }}
      # Determine whether we should use special "unstable" release_tag. Assume
      # that for unstable branch, PRs targeting unstable, and any external
      # call, dispatch or schedule we are building unstable release. In other cases it's a regular PR/push
      # build without using specific release_tag.
      release_tag: >-
        ${{ (github.ref_name == 'unstable'
        || github.base_ref == 'unstable'
        || github.event_name == 'workflow_dispatch'
        || github.event_name == 'workflow_call'
        || github.event_name == 'schedule')
        && 'unstable'
        || ''
        }}

